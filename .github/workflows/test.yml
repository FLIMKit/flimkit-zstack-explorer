name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FLIMKit
        run: |
          python -m pip install --upgrade pip
          pip install 'flimkit @ git+https://github.com/FLIMKit/FLIMKit'

      - name: Install the plugin
        run: |
          pip install -e '.[test]'
          pip install pytest-timeout

      - name: Run tests
        run: pytest -q --timeout=120 --timeout-method=thread

  test-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install headless display packages (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglx-mesa0

      - name: Install FLIMKit
        run: |
          python -m pip install --upgrade pip
          pip install 'flimkit @ git+https://github.com/FLIMKit/FLIMKit'

      - name: Install the plugin with the 3D viewer extra
        run: |
          pip install -e '.[test,gui]'
          pip install pytest-timeout

      - name: Run tests (including the offscreen PyVista viewer)
        env:
          PYVISTA_OFF_SCREEN: 'true'
        run: xvfb-run -a pytest -q --timeout=120 --timeout-method=thread
