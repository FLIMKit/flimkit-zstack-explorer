name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: |
            3D intensity and FLIM volume explorer for FLIMKit z-stacks. Builds
            (Z, Y, X) intensity and lifetime volumes from a loaded z-stack, saves
            them as OME-Zarr, and opens a PyVista popout viewer.

            ```
            pip install flimkit-zstack-explorer[gui]
            ```

            FLIMKit discovers it through the `flimkit.plugins` entry point, so
            there's nothing else to wire up. On start it appears under
            Tools > 3D Z-stack Explorer...

            The wheel and sdist are attached below for anyone installing offline,
            or into `~/.flimkit/plugins/`.
